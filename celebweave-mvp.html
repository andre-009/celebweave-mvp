<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelebWeave - Event Management MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .qr-container { display: inline-block; padding: 20px; background: white; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // State management
        const state = {
            currentUser: JSON.parse(localStorage.getItem('currentUser')) || null,
            events: JSON.parse(localStorage.getItem('events')) || [],
            guests: JSON.parse(localStorage.getItem('guests')) || [],
            rsvps: JSON.parse(localStorage.getItem('rsvps')) || [],
            currentPage: 'home',
            currentEventId: null,
            inviteCode: null,
        };

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('currentUser', JSON.stringify(state.currentUser));
            localStorage.setItem('events', JSON.stringify(state.events));
            localStorage.setItem('guests', JSON.stringify(state.guests));
            localStorage.setItem('rsvps', JSON.stringify(state.rsvps));
        }

        // Navigation
        function goTo(page, eventId = null) {
            state.currentPage = page;
            state.currentEventId = eventId;
            render();
        }

        // Generate unique ID
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Generate QR Code
        function generateQRCode(data, elementId) {
            setTimeout(() => {
                const element = document.getElementById(elementId);
                if (element) {
                    element.innerHTML = '';
                    new QRCode(element, { text: JSON.stringify(data), width: 200, height: 200 });
                }
            }, 100);
        }

        // ============ PAGE COMPONENTS ============

        // LOGIN / SIGNUP
        function LoginPage() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
                        <h1 class="text-3xl font-bold text-center mb-2 text-purple-600">CelebWeave</h1>
                        <p class="text-center text-gray-600 mb-8">Celebrate Without Stress</p>
                        
                        <div id="loginForm">
                            <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                            <input type="text" id="name" placeholder="Full Name" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                            <button onclick="handleLogin()" class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition">Sign In / Create Account</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            if (email && name) {
                state.currentUser = { id: generateId(), email, name };
                saveState();
                goTo('dashboard');
            }
        }

        // DASHBOARD
        function DashboardPage() {
            const userEvents = state.events.filter(e => e.userId === state.currentUser.id);
            return `
                <div class="min-h-screen bg-gray-50">
                    <nav class="bg-white shadow-sm">
                        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 class="text-2xl font-bold text-purple-600">CelebWeave</h1>
                            <div class="text-sm text-gray-600">
                                Hello, <span class="font-semibold">${state.currentUser.name}</span>
                                <button onclick="handleLogout()" class="ml-4 px-3 py-1 bg-red-500 text-white rounded-lg text-xs hover:bg-red-600">Logout</button>
                            </div>
                        </div>
                    </nav>

                    <div class="max-w-6xl mx-auto px-4 py-12">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                            <div class="bg-white p-6 rounded-lg shadow-sm">
                                <h3 class="text-3xl font-bold text-purple-600">${userEvents.length}</h3>
                                <p class="text-gray-600">Total Events</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow-sm">
                                <h3 class="text-3xl font-bold text-pink-600">${state.rsvps.filter(r => r.status === 'accepted').length}</h3>
                                <p class="text-gray-600">Total RSVPs</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow-sm">
                                <h3 class="text-3xl font-bold text-blue-600">${state.guests.length}</h3>
                                <p class="text-gray-600">Total Guests</p>
                            </div>
                        </div>

                        <div class="flex justify-between items-center mb-8">
                            <h2 class="text-2xl font-bold">My Events</h2>
                            <button onclick="goTo('createEvent')" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition font-semibold">+ Create Event</button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${userEvents.length === 0 ? `
                                <p class="text-gray-500">No events yet. Create your first event!</p>
                            ` : userEvents.map(event => `
                                <div class="bg-white p-6 rounded-lg shadow-sm hover:shadow-md transition cursor-pointer" onclick="goTo('eventDetails', '${event.id}')">
                                    <h3 class="text-xl font-bold mb-2">${event.name}</h3>
                                    <p class="text-gray-600 text-sm mb-1"><strong>Date:</strong> ${event.date}</p>
                                    <p class="text-gray-600 text-sm mb-1"><strong>Venue:</strong> ${event.venue}</p>
                                    <p class="text-gray-600 text-sm mb-4"><strong>Guests:</strong> ${event.guestCount || 0}</p>
                                    <button onclick="event.stopPropagation(); goTo('eventDetails', '${event.id}')" class="text-purple-600 font-semibold hover:underline">View Details →</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogout() {
            state.currentUser = null;
            state.currentPage = 'home';
            saveState();
            render();
        }

        // CREATE EVENT
        function CreateEventPage() {
            return `
                <div class="min-h-screen bg-gray-50 py-12">
                    <div class="max-w-2xl mx-auto px-4">
                        <button onclick="goTo('dashboard')" class="mb-6 text-purple-600 hover:underline">← Back to Dashboard</button>
                        
                        <div class="bg-white rounded-lg shadow-lg p-8">
                            <h2 class="text-3xl font-bold mb-8">Create Your Event</h2>
                            
                            <form id="eventForm" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-semibold mb-2">Event Name</label>
                                    <input type="text" id="eventName" placeholder="e.g., Sarah & John's Wedding" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold mb-2">Date</label>
                                        <input type="date" id="eventDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold mb-2">Time</label>
                                        <input type="time" id="eventTime" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold mb-2">Venue</label>
                                    <input type="text" id="eventVenue" placeholder="e.g., Lekki Gardens, Lagos" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold mb-2">Dress Code (Optional)</label>
                                    <input type="text" id="eventDressCode" placeholder="e.g., White Tie, Casual" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold mb-2">Max Guests</label>
                                    <input type="number" id="eventMaxGuests" placeholder="100" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                </div>

                                <button type="button" onclick="handleCreateEvent()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">Create Event</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleCreateEvent() {
            const name = document.getElementById('eventName').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const venue = document.getElementById('eventVenue').value;
            const dressCode = document.getElementById('eventDressCode').value;
            const maxGuests = document.getElementById('eventMaxGuests').value;

            if (name && date && venue) {
                const event = {
                    id: generateId(),
                    userId: state.currentUser.id,
                    name,
                    date,
                    time,
                    venue,
                    dressCode,
                    maxGuests: parseInt(maxGuests) || 100,
                    createdAt: new Date().toISOString(),
                    guestCount: 0,
                };
                state.events.push(event);
                saveState();
                goTo('eventDetails', event.id);
            }
        }

        // EVENT DETAILS
        function EventDetailsPage() {
            const event = state.events.find(e => e.id === state.currentEventId);
            if (!event) return '<p class="p-8">Event not found</p>';

            const eventGuests = state.guests.filter(g => g.eventId === event.id);
            const eventRsvps = state.rsvps.filter(r => eventGuests.some(g => g.id === r.guestId));
            const acceptedCount = eventRsvps.filter(r => r.status === 'accepted').length;

            return `
                <div class="min-h-screen bg-gray-50 py-12">
                    <div class="max-w-6xl mx-auto px-4">
                        <button onclick="goTo('dashboard')" class="mb-6 text-purple-600 hover:underline">← Back to Dashboard</button>

                        <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
                            <h2 class="text-4xl font-bold mb-2">${event.name}</h2>
                            <p class="text-gray-600 mb-4">📅 ${event.date} at ${event.time || 'TBA'} | 📍 ${event.venue}</p>
                            <p class="text-gray-600 mb-4">👥 ${acceptedCount} / ${event.maxGuests} guests confirmed</p>
                            ${event.dressCode ? `<p class="text-gray-600">👔 Dress Code: ${event.dressCode}</p>` : ''}
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <button onclick="goTo('manageGuests', '${event.id}')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-6 rounded-lg hover:shadow-lg transition">
                                <h3 class="text-2xl font-bold mb-2">👥 Manage Guests</h3>
                                <p class="text-sm">Upload or add guests</p>
                            </button>
                            <button onclick="goTo('guestRsvpLink', '${event.id}')" class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white p-6 rounded-lg hover:shadow-lg transition">
                                <h3 class="text-2xl font-bold mb-2">📧 Send Invites</h3>
                                <p class="text-sm">Share RSVP link</p>
                            </button>
                            <button onclick="goTo('checkIn', '${event.id}')" class="bg-gradient-to-r from-green-600 to-emerald-600 text-white p-6 rounded-lg hover:shadow-lg transition">
                                <h3 class="text-2xl font-bold mb-2">✅ Check-in</h3>
                                <p class="text-sm">Scan QR codes</p>
                            </button>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-8">
                            <h3 class="text-2xl font-bold mb-6">Guest Responses</h3>
                            ${eventGuests.length === 0 ? `
                                <p class="text-gray-500">No guests added yet. Start by managing guests!</p>
                            ` : `
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="border-b-2 border-gray-200">
                                            <tr>
                                                <th class="pb-3 font-semibold">Guest Name</th>
                                                <th class="pb-3 font-semibold">Email</th>
                                                <th class="pb-3 font-semibold">RSVP Status</th>
                                                <th class="pb-3 font-semibold">Check-in</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${eventGuests.map(guest => {
                                                const rsvp = eventRsvps.find(r => r.guestId === guest.id);
                                                const status = rsvp?.status || 'pending';
                                                return `
                                                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                                                        <td class="py-3">${guest.name}</td>
                                                        <td class="py-3">${guest.email}</td>
                                                        <td class="py-3">
                                                            <span class="px-3 py-1 rounded-full text-sm font-semibold ${
                                                                status === 'accepted' ? 'bg-green-100 text-green-800' :
                                                                status === 'declined' ? 'bg-red-100 text-red-800' :
                                                                'bg-yellow-100 text-yellow-800'
                                                            }">
                                                                ${status === 'accepted' ? '✅ Accepted' : status === 'declined' ? '❌ Declined' : '⏳ Pending'}
                                                            </span>
                                                        </td>
                                                        <td class="py-3"><span class="text-gray-500">-</span></td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // MANAGE GUESTS
        function ManageGuestsPage() {
            const event = state.events.find(e => e.id === state.currentEventId);
            if (!event) return '<p class="p-8">Event not found</p>';

            const eventGuests = state.guests.filter(g => g.eventId === event.id);

            return `
                <div class="min-h-screen bg-gray-50 py-12">
                    <div class="max-w-4xl mx-auto px-4">
                        <button onclick="goTo('eventDetails', '${event.id}')" class="mb-6 text-purple-600 hover:underline">← Back to Event</button>

                        <div class="bg-white rounded-lg shadow-lg p-8">
                            <h2 class="text-3xl font-bold mb-8">Manage Guests for ${event.name}</h2>

                            <div id="guestForm" class="mb-8 p-6 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
                                <h3 class="text-lg font-semibold mb-4">Add a Guest</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="guestName" placeholder="Guest Name" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                    <input type="email" id="guestEmail" placeholder="Email" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                                </div>
                                <button type="button" onclick="handleAddGuest('${event.id}')" class="mt-4 w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-semibold">Add Guest</button>
                            </div>

                            <h3 class="text-xl font-bold mb-4">Guest List (${eventGuests.length})</h3>
                            <div class="space-y-3">
                                ${eventGuests.length === 0 ? `
                                    <p class="text-gray-500">No guests added yet.</p>
                                ` : eventGuests.map(guest => `
                                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-lg border border-gray-200">
                                        <div>
                                            <p class="font-semibold">${guest.name}</p>
                                            <p class="text-sm text-gray-600">${guest.email}</p>
                                        </div>
                                        <button onclick="handleRemoveGuest('${guest.id}', '${event.id}')" class="text-red-600 hover:text-red-800 font-semibold">Remove</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAddGuest(eventId) {
            const name = document.getElementById('guestName').value;
            const email = document.getElementById('guestEmail').value;

            if (name && email) {
                const guest = {
                    id: generateId(),
                    eventId,
                    name,
                    email,
                };
                state.guests.push(guest);
                saveState();
                goTo('manageGuests', eventId);
            }
        }

        function handleRemoveGuest(guestId, eventId) {
            state.guests = state.guests.filter(g => g.id !== guestId);
            state.rsvps = state.rsvps.filter(r => r.guestId !== guestId);
            saveState();
            goTo('manageGuests', eventId);
        }

        // GUEST RSVP LINK
        function GuestRsvpLinkPage() {
            const event = state.events.find(e => e.id === state.currentEventId);
            if (!event) return '<p class="p-8">Event not found</p>';

            const inviteLink = `${window.location.origin}?invite=${event.id}`;

            return `
                <div class="min-h-screen bg-gray-50 py-12">
                    <div class="max-w-2xl mx-auto px-4">
                        <button onclick="goTo('eventDetails', '${event.id}')" class="mb-6 text-purple-600 hover:underline">← Back to Event</button>

                        <div class="bg-white rounded-lg shadow-lg p-8">
                            <h2 class="text-3xl font-bold mb-8">Invite Guests</h2>

                            <p class="text-gray-600 mb-6">Share this link with your guests so they can RSVP:</p>

                            <div class="bg-gray-100 p-4 rounded-lg mb-6 flex justify-between items-center">
                                <code class="text-sm break-all">${inviteLink}</code>
                                <button onclick="navigator.clipboard.writeText('${inviteLink}'); alert('Link copied!')" class="ml-2 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition whitespace-nowrap">Copy Link</button>
                            </div>

                            <p class="text-sm text-gray-600 mb-8">Or share directly:</p>
                            <div class="flex gap-3">
                                <button onclick="window.open('https://wa.me/?text=' + encodeURIComponent('Hey! Please RSVP to my event: ${inviteLink}'), '_blank')" class="flex-1 bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition">📱 WhatsApp</button>
                                <button onclick="window.open('mailto:?subject=' + encodeURIComponent('${event.name}') + '&body=' + encodeURIComponent('Please RSVP: ${inviteLink}'), '_blank')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">📧 Email</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // PUBLIC RSVP PAGE (What guests see)
        function PublicRsvpPage() {
            const event = state.events.find(e => e.id === state.inviteCode);
            if (!event) return '<p class="p-8">Event not found</p>';

            return `
                <div class="min-h-screen bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full fade-in">
                        <h1 class="text-3xl font-bold text-center mb-2 text-purple-600">${event.name}</h1>
                        <p class="text-center text-gray-600 mb-8">You've been invited!</p>

                        <div class="bg-gray-50 p-6 rounded-lg mb-8 space-y-3">
                            <p><strong>📅 Date:</strong> ${event.date}</p>
                            <p><strong>🕐 Time:</strong> ${event.time || 'TBA'}</p>
                            <p><strong>📍 Venue:</strong> ${event.venue}</p>
                            ${event.dressCode ? `<p><strong>👔 Dress Code:</strong> ${event.dressCode}</p>` : ''}
                        </div>

                        <form id="rsvpForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold mb-2">Your Name</label>
                                <input type="text" id="rsvpName" placeholder="Full Name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2">Email</label>
                                <input type="email" id="rsvpEmail" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
                            </div>

                            <div class="grid grid-cols-2 gap-4 pt-4">
                                <button type="button" onclick="handleRsvp('${event.id}', 'accepted')" class="bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition font-semibold">✅ Accept</button>
                                <button type="button" onclick="handleRsvp('${event.id}', 'declined')" class="bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition font-semibold">❌ Decline</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleRsvp(eventId, status) {
            const name = document.getElementById('rsvpName').value;
            const email = document.getElementById('rsvpEmail').value;

            if (name && email) {
                // Create guest if not exists
                let guest = state.guests.find(g => g.email === email && g.eventId === eventId);
                if (!guest) {
                    guest = {
                        id: generateId(),
                        eventId,
                        name,
                        email,
                    };
                    state.guests.push(guest);
                }

                // Create or update RSVP
                let rsvp = state.rsvps.find(r => r.guestId === guest.id);
                if (!rsvp) {
                    rsvp = {
                        id: generateId(),
                        guestId: guest.id,
                        eventId,
                        status,
                        createdAt: new Date().toISOString(),
                    };
                    state.rsvps.push(rsvp);
                } else {
                    rsvp.status = status;
                }

                saveState();
                state.currentPage = 'rsvpConfirmation';
                state.currentRsvpId = rsvp.id;
                render();
            }
        }

        // RSVP CONFIRMATION & QR CODE
        function RsvpConfirmationPage() {
            const rsvp = state.rsvps.find(r => r.id === state.currentRsvpId);
            const guest = state.guests.find(g => g.id === rsvp.guestId);
            const event = state.events.find(e => e.id === rsvp.eventId);

            if (!rsvp || !guest || !event) return '<p class="p-8">Data not found</p>';

            const qrData = {
                guestId: guest.id,
                guestName: guest.name,
                eventId: event.id,
                eventName: event.name,
                token: rsvp.id,
            };

            setTimeout(() => generateQRCode(qrData, 'qrCodeContainer'), 100);

            return `
                <div class="min-h-screen bg-gradient-to-br from-green-600 to-emerald-600 flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full fade-in text-center">
                        <h1 class="text-3xl font-bold mb-2 text-green-600">✅ RSVP Confirmed!</h1>
                        <p class="text-gray-600 mb-8">Thanks for confirming, ${guest.name}!</p>

                        <div class="bg-gray-50 p-6 rounded-lg mb-8">
                            <p class="text-sm text-gray-600 mb-2">Your Check-in QR Code</p>
                            <div id="qrCodeContainer" class="qr-container mx-auto"></div>
                        </div>

                        <div class="bg-blue-50 p-4 rounded-lg mb-8">
                            <p class="text-sm text-gray-700"><strong>Save this code</strong> or screenshot it. You'll need it to check in at the event.</p>
                        </div>

                        <button onclick="goTo('dashboard')" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-semibold">Back to Home</button>
                    </div>
                </div>
            `;
        }

        // CHECK-IN SCANNER
        function CheckInPage() {
            const event = state.events.find(e => e.id === state.currentEventId);
            if (!event) return '<p class="p-8">Event not found</p>';

            return `
                <div class="min-h-screen bg-gray-50 py-12">
                    <div class="max-w-2xl mx-auto px-4">
                        <button onclick="goTo('eventDetails', '${event.id}')" class="mb-6 text-purple-600 hover:underline">← Back to Event</button>

                        <div class="bg-white rounded-lg shadow-lg p-8">
                            <h2 class="text-3xl font-bold mb-8">${event.name} - Check-in</h2>

                            <div class="bg-blue-50 p-6 rounded-lg mb-8">
                                <p class="text-sm text-blue-800"><strong>Demo Mode:</strong> Click on guest names below to simulate QR scan. In production, this would use a camera scanner.</p>
                            </div>

                            <h3 class="text-xl font-bold mb-6">Scan Guest QR Code</h3>
                            <div id="checkinSimulator" class="space-y-3 mb-8 p-6 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
                                <p class="text-gray-600 text-center mb-6">Click a guest to simulate check-in:</p>
                                <div class="space-y-2">
                                    ${state.guests.filter(g => g.eventId === event.id).map((guest, idx) => {
                                        const rsvp = state.rsvps.find(r => r.guestId === guest.id);
                                        const isCheckedIn = rsvp && rsvp.checkedIn;
                                        return `
                                            <button onclick="handleSimulateCheckin('${rsvp?.id || ''}')" class="w-full p-4 bg-white rounded-lg border border-gray-200 hover:border-purple-500 hover:shadow-md transition text-left ${isCheckedIn ? 'opacity-50' : ''}">
                                                <span class="font-semibold">${guest.name}</span>
                                                <span class="ml-2 text-sm text-gray-600">${guest.email}</span>
                                                ${isCheckedIn ? '<span class="ml-2 text-green-600 font-bold">✅ CHECKED IN</span>' : ''}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <h3 class="text-xl font-bold mb-4">Recent Check-ins</h3>
                            <div class="space-y-3">
                                ${state.rsvps.filter(r => r.eventId === event.id && r.checkedIn).map(rsvp => {
                                    const guest = state.guests.find(g => g.id === rsvp.guestId);
                                    return `
                                        <div class="p-4 bg-green-50 border border-green-200 rounded-lg flex justify-between items-center">
                                            <div>
                                                <p class="font-semibold">${guest.name}</p>
                                                <p class="text-xs text-gray-600">${rsvp.checkinTime || 'Just now'}</p>
                                            </div>
                                            <span class="text-green-600 font-bold">✅</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSimulateCheckin(rsvpId) {
            const rsvp = state.rsvps.find(r => r.id === rsvpId);
            if (rsvp && !rsvp.checkedIn) {
                rsvp.checkedIn = true;
                rsvp.checkinTime = new Date().toLocaleTimeString();
                saveState();
                goTo('checkIn', rsvp.eventId);
            } else if (rsvp && rsvp.checkedIn) {
                alert('Guest already checked in!');
            }
        }

        // ROUTER
        function render() {
            const app = document.getElementById('app');
            
            if (!state.currentUser) {
                app.innerHTML = LoginPage();
                return;
            }

            switch (state.currentPage) {
                case 'dashboard':
                    app.innerHTML = DashboardPage();
                    break;
                case 'createEvent':
                    app.innerHTML = CreateEventPage();
                    break;
                case 'eventDetails':
                    app.innerHTML = EventDetailsPage();
                    break;
                case 'manageGuests':
                    app.innerHTML = ManageGuestsPage();
                    break;
                case 'guestRsvpLink':
                    app.innerHTML = GuestRsvpLinkPage();
                    break;
                case 'rsvpConfirmation':
                    app.innerHTML = RsvpConfirmationPage();
                    break;
                case 'checkIn':
                    app.innerHTML = CheckInPage();
                    break;
                default:
                    app.innerHTML = DashboardPage();
            }
        }

        // Check for invite code in URL
        function checkInviteCode() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('invite')) {
                state.inviteCode = params.get('invite');
                state.currentPage = 'publicRsvp';
            }
        }

        // INIT
        checkInviteCode();
        if (state.currentPage === 'publicRsvp') {
            document.getElementById('app').innerHTML = PublicRsvpPage();
        } else {
            render();
        }
    </script>
</body>
</html>
